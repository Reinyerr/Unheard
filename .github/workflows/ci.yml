name: Regression checks
on:
  pull_request:
  push:
    branches: [main, feature/final-integration]
permissions:
  contents: read
jobs:
  offline-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements.txt
      - run: npm ci --prefix frontend
      - run: python -m pytest backend/tests scripts/tests -q
      - run: python scripts/validate_exports.py
      - run: python -m compileall -q backend/app scripts
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build
      - run: git diff --check
      # Real API preflight and localhost/browser rehearsal are separate manual gates.
      # No secrets, provider commands, raw ZIP, or generated audio required here.
